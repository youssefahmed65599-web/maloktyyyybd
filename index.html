<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>♡</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#26364b;background:linear-gradient(145deg,#fff7fb,#eefaff)}#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 15% 15%,#ffb8d766,transparent 35%),radial-gradient(circle at 85% 85%,#91ddff66,transparent 35%)}.box{width:min(380px,100%);padding:38px 25px;text-align:center;border:1px solid #fff;border-radius:30px;background:#ffffffc7;backdrop-filter:blur(18px);box-shadow:0 25px 70px #52647b22}.logo{width:82px;height:82px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#ff8db8,#9adfff);box-shadow:0 12px 30px #ff8db844}.box h1{font-size:30px;margin:20px 0 8px}.box p{color:#718096;line-height:1.8}input{width:100%;padding:14px;border:1px solid #dce5ef;border-radius:15px;text-align:center;font-size:17px;margin:10px 0}button{width:100%;border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#ff80ad,#8dd9ff);cursor:pointer}.err{height:25px;color:#e15b88;margin-top:8px}#app{display:none}nav{position:sticky;top:0;z-index:5;background:#ffffffc9;backdrop-filter:blur(14px);border-bottom:1px solid #dfeaf1}.nav{max-width:900px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between}.brand{font-weight:bold;background:linear-gradient(90deg,#ed6f9f,#53bde9);-webkit-background-clip:text;color:transparent}.links a{color:#536277;text-decoration:none;margin-left:14px;font-size:13px}.hero{min-height:75vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}.hero h1{font-size:clamp(50px,11vw,76px);margin:0;background:linear-gradient(90deg,#ee709f,#5bbde8);-webkit-background-clip:text;color:transparent}.heart{font-size:28px;color:#ef79a6;letter-spacing:8px;margin-top:20px}section{max-width:900px;margin:auto;padding:60px 20px}.title{text-align:center;margin-bottom:28px}.title h2{font-size:30px;margin:0}.message{background:#ffffffbb;border:1px solid #fff;border-radius:25px;padding:25px;box-shadow:0 15px 45px #5b668018}.message textarea{width:100%;min-height:210px;resize:vertical;border:1px solid #dce5ef;border-radius:18px;padding:16px;font:16px Arial;outline:none}.message button{width:auto;margin-top:10px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.photo{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,#ffd3e4,#cceeff);border:2px solid #fff}.video,.song{background:#ffffffbb;border:1px solid #fff;border-radius:25px;padding:15px;box-shadow:0 15px 45px #5b668018}.video-box{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(135deg,#ffd3e4,#cceeff);display:grid;place-items:center;color:#718096}.song{text-align:center;text-decoration:none;color:#33445a;display:block;padding:28px}.song-icon{font-size:45px}@media(max-width:600px){.links{display:none}section{padding:45px 15px}.gallery{gap:10px}}
</style></head><body>
<div id="lock"><div class="box"><div class="logo">♡</div><h1></h1><p></p><input id="pw" type="password" inputmode="numeric" placeholder=""><button onclick="unlock()">♡</button><div id="error" class="err"></div></div></div>
<div id="app"><nav><div class="nav"><div class="brand">♡</div><div class="links"><a href="#message"></a><a href="#photos"></a><a href="#video"></a><a href="#song"></a></div></div></nav>
<header class="hero"><div><h1>♡</h1><div class="heart">♡ ✦ ♡ ✦ ♡</div></div></header>
<section id="message"><div class="title"><h2> 💌</h2></div><div class="message"><textarea id="messageText"></textarea><button onclick="save()">♡ ✨</button><div id="saved"></div></div></section>
<section id="photos"><div class="title"><h2> 📸</h2></div><div class="gallery"><div class="photo"></div><div class="photo"></div><div class="photo"></div><div class="photo"></div></div></section>
<section id="video"><div class="title"><h2> 🎬</h2></div><div class="video"><div class="video-box"></div></div></section>
<section id="song"><div class="title"><h2> 🎵</h2></div><a class="song" href="#" target="_blank"><div class="song-icon">🎧</div></a></section>
</div><script>const PASS="246";function unlock(){if(pw.value===PASS){lock.style.display="none";app.style.display="block"}else error.textContent="Wrong password ♡"}pw.addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});function save(){localStorage.setItem("message",messageText.value);saved.textContent="♡d ♡"}messageText.value=localStorage.getItem("message")||"";</script></body></html>
